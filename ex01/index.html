<!DOCTYPE html>
<html lang="vi">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scales=1.0">
      <title>bài thơ Bốn mùa</title>
<style>
      :root{
            --nen-khung: #FFFDE7;
            --vien-khung: #9E9E9E;
            --nen-tieu-de: #FFD9E6;
            --mau-do: #D40000;
            --mau-xanh: #0033CC;

      }
      body{
            margin:0;
            min-height: 100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Times New Roman', Times, serif;  
      }
      .khungtho {
            width:640px;
            text-align:center;
            background-color:var(--nen-khung);
            bord:1px solid var(--vien-khung);
            margin:30px;
            padding:24px;
      }
      h1{
            color:var(--mau-do);
            background-color:var(--nen-tieu-de);
            font-size: 26px;
            padding:6px 0;
            margin: 0 0 20px;
      }
      p{
            font-style:italic;
            line-height:1.7;   
      }
      .maudo{
            color:var(--mau-do);
      }
      .mauxanh{
            color:var(--mau-xanh);
      }
      hr{
            width:55%;
            border:none;
            border-top:1px solid var(--mau-xanh);
      }

</style>     
</head>
<body>
      <article class="khungtho">
         <h1>Bốn mùa</h1>
         
 
 
 <p class="mauxanh">
        Xuân về hoa nở khắp trời<br>
    Hạ sang nắng cháy rạng ngời phố quen<br>
        Thu về lá rụng bên thềm<br>
 </p>

 <hr>

 <P class="maudo">
      Đông sang gió lạnh bên em đợi chờ<br>
         Bốn mùa là bốn giấc mơ<br>
        Thời gian đi mãi ta chờ đợi ai<br>      
 </P>

 <hr>

 <P class="mauxanh">
         Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
         Chờ xuân nắng mới soi đường<br>    
 </P>
</article>
</body>
</html>
